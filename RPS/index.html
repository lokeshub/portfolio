<!-- <!DOCTYPE html> -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS</title>
    
    <link rel="stylesheet" href="./css/style.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>
<body>
    <h1 class="header">Click your choice !</h1>
    <div class="container">
        <div class="row">
          <div class="col">
            <div class="window">
            <div class="computer board">
                <h3>Computer's choice</h3>
            </div>
            <div>
                <img id="computer-selection" class="board-img" src="./images/rocks.png" alt="computer selection">
            </div>
            </div>
          </div>
          <div class="col">
            <div class="window">
            <div class="player board">
                <h3>Player's choice</h3>
            </div>
            <div>
                <img id="player-selection" class="board-img" src="./images/scissor.png" alt="player selection">
            </div>
            </div>
          </div>
          </div>
        </div>

        <!-- Choices container -->

        <div class="row">
            
            <div class="col">
              <div class="select">
                  <button id="fist-id" class="fist select-btn"></button>
                  <!-- <img class="choice-img" src="./images/fist.png" alt="rock choice"> -->
              </div>
            </div>
            <div class="col">
              <div class="select">
                  <button id="paper-id" class="paper select-btn"></button>
                  <!-- <img class="choice-img" src="./images/hand-paper.png" alt="paper choice"> -->
              </div>
            </div>
            <div class="col">
                <div class="select">
                  <button id="scissors-id" class="scissors select-btn"></button>
                   <!-- <img class="choice-img" src="./images/scissors.png" alt="scissor choice"> -->
                </div>
              </div>
            </div>
            
          </div>

      </div>

    <script src="./index.js" charset="UTF-8"></script>

</body>
</html>
