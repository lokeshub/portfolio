<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>TTT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

  <link rel="stylesheet" href="css/styles.css">

</head>

<body>
  <h1 id="header"> Welcome to Tic tac toe !</h1>
  <br>

  <h1 class="turn"> Player 1 -> 'X'</h1>
  <br>

  <div class="alert alert-warning alert-dismissible fade show" role="alert">
  </div>

  <br>
  <div class="ref-btn">
    <button class="refresh" type="button" name="button" onClick="window.location.reload()">Refresh</button>

  </div>

  <br>

  <div class="gameBoard">
    <div class="btn-group" role="group" aria-label="Basic example">
      <button type="button" id="a0" onclick="reply_click(id)" class="btn btn-primary btn-lg">-</button>
      <button type="button" id="a1" onclick="reply_click(id)" class="btn btn-primary btn-lg">-</button>
      <button type="button" id="a2" onclick="reply_click(id)" class="btn btn-primary btn-lg">-</button>
    </div>
    <br>
    <div class="btn-group" role="group" aria-label="Basic example">
      <button type="button" id="b0" onclick="reply_click(id)" class="btn btn-primary btn-lg">-</button>
      <button type="button" id="b1" onclick="reply_click(id)" class="btn btn-primary btn-lg">-</button>
      <button type="button" id="b2" onclick="reply_click(id)" class="btn btn-primary btn-lg">-</button>
    </div>
    <br>
    <div class="btn-group" role="group" aria-label="Basic example">
      <button type="button" id="c0" onclick="reply_click(id)" class="btn btn-primary btn-lg">-</button>
      <button type="button" id="c1" onclick="reply_click(id)" class="btn btn-primary btn-lg">-</button>
      <button type="button" id="c2" onclick="reply_click(id)" class="btn btn-primary btn-lg">-</button>
    </div>

  </div>




  <script src="script/index.js"></script>
</body>

</html>
